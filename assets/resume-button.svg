<svg xmlns="http://www.w3.org/2000/svg"
     width="300"
     height="64"
     viewBox="0 0 300 64"
     role="img"
     aria-label="Download Resume">

  <defs>
    <!-- Dark green background -->
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123D2B"/>
      <stop offset="100%" stop-color="#071F17"/>
    </linearGradient>

    <!-- Green border -->
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>

    <!-- Icon background -->
    <linearGradient id="iconBackground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>

    <!-- Shine effect -->
    <linearGradient id="shine">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Clip animation inside button -->
    <clipPath id="buttonClip">
      <rect x="2" y="2" width="296" height="60" rx="15"/>
    </clipPath>
  </defs>

  <!-- Button background -->
  <rect x="2"
        y="2"
        width="296"
        height="60"
        rx="15"
        fill="url(#background)"
        stroke="url(#border)"
        stroke-width="1.5"/>

  <!-- Download icon container -->
  <rect x="11"
        y="10"
        width="44"
        height="44"
        rx="10"
        fill="url(#iconBackground)"/>

  <!-- Download icon -->
  <g transform="translate(33,31)"
     fill="none"
     stroke="#FFFFFF"
     stroke-width="2.2"
     stroke-linecap="round"
     stroke-linejoin="round">

    <path d="M0 -11 V5"/>
    <path d="M-6 -1 L0 5 L6 -1"/>
    <path d="M-11 8 V12 H11 V8"/>

  </g>

  <!-- Vertical divider -->
  <line x1="66"
        y1="17"
        x2="66"
        y2="47"
        stroke="#4ADE80"
        stroke-opacity="0.4"
        stroke-width="1.2"/>

  <!-- Button text -->
  <text x="83"
        y="38"
        fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        font-weight="700"
        letter-spacing="1">

    DOWNLOAD RESUME

  </text>

  <!-- PDF indicator -->
  <g transform="translate(265,32)"
     fill="none"
     stroke="#4ADE80"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">

    <path d="M-7 -11 H2 L8 -5 V11 H-7 Z"/>
    <path d="M2 -11 V-5 H8"/>

  </g>

  <!-- Subtle moving shine -->
  <g clip-path="url(#buttonClip)">

    <rect x="-65"
          y="0"
          width="38"
          height="64"
          fill="url(#shine)"
          transform="skewX(-20)">

      <animate attributeName="x"
               values="-65;365"
               dur="5s"
               repeatCount="indefinite"/>

    </rect>

  </g>

</svg>
